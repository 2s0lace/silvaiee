<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aiceus</title>
<style>
:root {
  --bg: #f4f3ef; --panel: #ffffff; --line: #dedbd2; --text: #1d1c1a; --muted: #6f6b62;
  --accent: #2f6fdb; --sel: rgba(47,111,219,.25);
  --SEAM: #e5484d; --RARE: #f2a516; --STAIR: #8e4ec6; --RECT: #12a594; --EMPTY: #3e63dd; --INFO: #6f6b62;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --line: #34332f; --text: #ecebe6; --muted: #9b978c;
    --accent: #6b9bff; --sel: rgba(107,155,255,.25);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif;
  display: grid; grid-template-columns: 220px 1fr 300px; height: 100vh; overflow: hidden; }
aside, section { overflow: auto; }
section { position: relative; }
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 10px; }
#right { border-right: 0; border-left: 1px solid var(--line); }
h1 { font-size: 15px; margin: 0 0 8px; } h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--muted); margin: 14px 0 6px; }
input, textarea, button, select { font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }
button { cursor: pointer; } button:hover { border-color: var(--accent); }
#filter { width: 100%; margin-bottom: 6px; }
.map { padding: 3px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; } .map:hover { background: var(--bg); } .map.on { background: var(--sel); }
.map small { color: var(--muted); }
#bar { position: sticky; top: 0; z-index: 3; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
#summary { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
#stage { padding: 16px; }
#wrap { position: relative; display: inline-block; cursor: crosshair; user-select: none; }
#img { display: block; image-rendering: pixelated; }
#ov { position: absolute; inset: 0; pointer-events: none; }
.box { position: absolute; border: 2px solid; }
.box.hot { outline: 3px solid var(--text); z-index: 2; }
#drag { position: absolute; border: 2px dashed var(--accent); background: var(--sel); display: none; }
#grid { position: absolute; inset: 0; pointer-events: none; display: none; }
#hover { font-family: ui-monospace, monospace; }
.warn { padding: 4px 6px; border-left: 3px solid; margin-bottom: 3px; cursor: pointer;
  font-family: ui-monospace, monospace; font-size: 11px; word-break: break-all; }
.warn:hover { background: var(--bg); }
.legend span { display: inline-block; margin-right: 8px; } .legend i { display: inline-block; width: 9px; height: 9px;
  border-radius: 2px; margin-right: 3px; }
#ticket { display: none; } #ticket textarea { width: 100%; height: 60px; margin: 6px 0; }
.t { font-family: ui-monospace, monospace; font-size: 11px; padding: 3px 0; border-bottom: 1px solid var(--line); }
.err { color: var(--SEAM); }
label { color: var(--muted); }
#tbox { text-transform: none; font-family: ui-monospace, monospace; color: var(--text); }
</style>
</head>
<body>
<aside>
  <h1>Aiceus</h1>
  <input id="filter" placeholder="Filter maps">
  <div id="maps"></div>
</aside>

<section>
  <div id="bar">
    <strong id="name">Pick a map</strong>
    <label>Zoom <select id="zoom"><option>2</option><option selected>3</option><option>4</option></select></label>
    <label><input type="checkbox" id="showLint" checked> Lint</label>
    <label><input type="checkbox" id="showGrid"> 15x10 screens</label>
    <span id="hover"></span>
    <div id="summary"></div>
  </div>
  <div id="stage">
    <div id="wrap">
      <img id="img" alt="">
      <canvas id="grid"></canvas>
      <div id="ov"></div>
      <div id="drag"></div>
    </div>
  </div>
</section>

<aside id="right">
  <div id="ticket">
    <h2>New ticket <span id="tbox"></span></h2>
    <textarea id="note" placeholder="What is wrong here? e.g. shoreline too straight, add a bend"></textarea>
    <button id="save">Save ticket</button> <button id="cancel">Cancel</button>
    <div id="terr" class="err"></div>
  </div>
  <h2>Lint <span id="count"></span></h2>
  <div class="legend" id="legend"></div>
  <div id="warns"></div>
  <h2>Tickets</h2>
  <div id="tickets"></div>
</aside>

<script>
const $ = id => document.getElementById(id);
const CHECKS = ['SEAM', 'RARE', 'STAIR', 'RECT', 'EMPTY'];
let maps = [], cur = null, lint = [], zoom = 3, sel = null, drag = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({ ok: false, error: 'BADJSON ' + r.status }));
  if (!j.ok) throw new Error(j.error);
  return j;
}
const color = c => getComputedStyle(document.documentElement).getPropertyValue('--' + c) || '#888';
const T = () => 16 * zoom;   // one metatile in screen pixels

$('legend').innerHTML = CHECKS.map(c => `<span><i style="background:${color(c)}"></i>${c}</span>`).join('');

async function loadMaps() {
  try { maps = (await api('/api/maps')).maps; } catch (e) { $('maps').innerHTML = `<div class="err">${e.message}</div>`; return; }
  maps.sort((a, b) => (b.name.startsWith('Pk') - a.name.startsWith('Pk')) || a.name.localeCompare(b.name));
  drawMaps();
  const want = decodeURIComponent(location.hash.slice(1));
  if (want && maps.some(m => m.name === want)) openMap(want);
}
function drawMaps() {
  const f = $('filter').value.toLowerCase();
  $('maps').innerHTML = maps.filter(m => m.name.toLowerCase().includes(f)).map(m =>
    `<div class="map${cur && cur.name === m.name ? ' on' : ''}" data-n="${m.name}" title="${m.name}">
      ${m.name.replace(/_Frlg$/, '')} <small>${m.w}x${m.h}</small></div>`).join('');
}
$('filter').oninput = drawMaps;
$('maps').onclick = e => { const d = e.target.closest('.map'); if (d) openMap(d.dataset.n); };

async function openMap(name) {
  location.hash = encodeURIComponent(name);
  $('name').textContent = name; $('summary').textContent = 'loading...'; $('warns').innerHTML = '';
  closeTicket();
  try {
    cur = await api('/api/map/' + encodeURIComponent(name));
  } catch (e) { $('summary').innerHTML = `<span class="err">${e.message}</span>`; return; }
  lint = cur.lint;
  $('summary').textContent = cur.summary;
  $('img').onload = layout;
  $('img').src = `/api/render/${encodeURIComponent(name)}.png?scale=1&t=${Date.now()}`;
  drawMaps(); drawWarns(); loadTickets();
}

function layout() {
  const w = cur.w * T(), h = cur.h * T();
  $('img').style.width = w + 'px'; $('img').style.height = h + 'px';
  const g = $('grid'); g.width = w; g.height = h;
  const ctx = g.getContext('2d'); ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
  for (let x = 15; x < cur.w; x += 15) { ctx.beginPath(); ctx.moveTo(x * T(), 0); ctx.lineTo(x * T(), h); ctx.stroke(); }
  for (let y = 10; y < cur.h; y += 10) { ctx.beginPath(); ctx.moveTo(0, y * T()); ctx.lineTo(w, y * T()); ctx.stroke(); }
  drawBoxes();
}

function drawBoxes() {
  const ov = $('ov'); ov.innerHTML = '';
  if (!$('showLint').checked) return;
  lint.forEach((it, i) => {
    if (it.x < 0) return;
    const b = document.createElement('div');
    b.className = 'box' + (i === sel ? ' hot' : '');
    Object.assign(b.style, { left: it.x * T() + 'px', top: it.y * T() + 'px',
      width: it.w * T() + 'px', height: it.h * T() + 'px', borderColor: color(it.check) });
    ov.appendChild(b);
  });
}

function drawWarns() {
  const n = c => lint.filter(i => i.check === c).length;
  $('count').textContent = `(${lint.filter(i => i.check !== 'INFO').length})`;
  $('legend').innerHTML = CHECKS.map(c => `<span><i style="background:${color(c)}"></i>${c} ${n(c)}</span>`).join('');
  $('warns').innerHTML = lint.map((it, i) =>
    `<div class="warn" data-i="${i}" style="border-color:${color(it.check)}">${esc(it.text)}</div>`).join('')
    || '<div style="color:var(--muted)">Clean.</div>';
}
$('warns').onclick = e => {
  const d = e.target.closest('.warn'); if (!d) return;
  sel = +d.dataset.i; drawBoxes();
  const it = lint[sel];
  if (it.x < 0) return;
  const s = document.querySelector('section'), wrap = $('wrap');
  s.scrollTo({ left: wrap.offsetLeft + (it.x + it.w / 2) * T() - s.clientWidth / 2,
               top: wrap.offsetTop + (it.y + it.h / 2) * T() - s.clientHeight / 2, behavior: 'smooth' });
};

// --- drag a box -> ticket ---
function cell(e) {
  const r = $('img').getBoundingClientRect();
  return { x: Math.max(0, Math.min(cur.w - 1, Math.floor((e.clientX - r.left) / T()))),
           y: Math.max(0, Math.min(cur.h - 1, Math.floor((e.clientY - r.top) / T()))) };
}
$('wrap').onmousedown = e => { if (!cur || e.button) return; drag = { a: cell(e) }; drag.b = drag.a; showDrag(); };
window.onmousemove = e => {
  if (!cur) return;
  const c = cell(e); $('hover').textContent = `@${c.x},${c.y}`;
  if (drag) { drag.b = c; showDrag(); }
};
window.onmouseup = () => { if (drag) { openTicket(box()); drag = null; } };
function box() {
  const x = Math.min(drag.a.x, drag.b.x), y = Math.min(drag.a.y, drag.b.y);
  return { x, y, w: Math.abs(drag.a.x - drag.b.x) + 1, h: Math.abs(drag.a.y - drag.b.y) + 1 };
}
function showDrag(b = box()) {
  Object.assign($('drag').style, { display: 'block', left: b.x * T() + 'px', top: b.y * T() + 'px',
    width: b.w * T() + 'px', height: b.h * T() + 'px' });
}
let pending = null;
function openTicket(b) {
  pending = b; $('ticket').style.display = 'block'; $('terr').textContent = '';
  $('tbox').textContent = b.w === 1 && b.h === 1 ? `@${b.x},${b.y}` : `${b.x},${b.y}-${b.w}x${b.h}`;
  $('note').focus();
}
function closeTicket() { pending = null; $('ticket').style.display = 'none'; $('drag').style.display = 'none'; $('note').value = ''; }
$('cancel').onclick = closeTicket;
$('note').onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('save').click(); if (e.key === 'Escape') closeTicket(); };
$('save').onclick = async () => {
  try {
    await api('/api/ticket', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ map: cur.name, ...pending, note: $('note').value.trim() }) });
    closeTicket(); loadTickets();
  } catch (e) { $('terr').textContent = e.message; }
};
async function loadTickets() {
  try {
    const t = (await api('/api/tickets')).tickets;
    $('tickets').innerHTML = t.slice().reverse().map(l => `<div class="t">${esc(l)}</div>`).join('')
      || '<div style="color:var(--muted)">Drag a box on the map to write one.</div>';
  } catch (e) { $('tickets').innerHTML = `<div class="err">${e.message}</div>`; }
}

$('zoom').onchange = () => {
  const s = document.querySelector('section'), k = +$('zoom').value / zoom;
  const cx = s.scrollLeft + s.clientWidth / 2, cy = s.scrollTop + s.clientHeight / 2;
  zoom = +$('zoom').value;
  if (cur) { layout(); if (pending) showDrag(pending); }
  s.scrollTo(cx * k - s.clientWidth / 2, cy * k - s.clientHeight / 2);   // keep the same spot centred
};
window.onhashchange = () => {
  const want = decodeURIComponent(location.hash.slice(1));
  if (want && (!cur || cur.name !== want)) openMap(want);
};
$('showLint').onchange = drawBoxes;
$('showGrid').onchange = () => $('grid').style.display = $('showGrid').checked ? 'block' : 'none';
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
loadMaps(); loadTickets();
</script>
</body>
</html>
